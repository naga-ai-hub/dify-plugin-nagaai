version: 0.1.0
type: plugin
author: nagaai
name: nagaai
label:
  en_US: NagaAI
description:
  en_US: Chat models from many vendors through the NagaAI API, with tool calling, vision, structured output and reasoning effort.
icon: icon.svg
resource:
  memory: 268435456
  permission:
    model:
      enabled: true
      llm: true
      text_embedding: false
      rerank: false
      tts: false
      speech2text: false
      moderation: false
plugins:
  models:
    - provider/nagaai.yaml
meta:
  version: 0.0.1
  arch:
    - amd64
    - arm64
  runner:
    language: python
    version: "3.12"
    entrypoint: main
  minimum_dify_version: 1.0.0
created_at: 2026-11-11T00:00:00+00:00
privacy: PRIVACY.md
repo: https://github.com/naga-ai-hub/dify-plugin-nagaai
contact: support@naga.ac
network:
  domains:
    - api.naga.ac
verified: false
